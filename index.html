<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema CRUD</title>
    <style>
        /* Estilos generales */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }
        
        /* Estilos para el formulario */
        .form-section {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }
        
        .form-title {
            color: #3498db;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .input-field {
            flex: 1;
            min-width: 200px;
        }
        
        .input-field label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #555;
        }
        
        .input-field input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .input-field input:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        
        .btn-guardar {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-guardar:hover {
            background-color: #27ae60;
        }
        
        /* Estilos para la tabla */
        .table-section {
            background-color: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        
        .table-title {
            color: #3498db;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        thead {
            background-color: #3498db;
            color: white;
        }
        
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        th {
            font-weight: 600;
        }
        
        tbody tr:hover {
            background-color: #f8f9fa;
        }
        
        .btn-accion {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            margin-right: 10px;
            transition: transform 0.2s ease;
        }
        
        .btn-accion:hover {
            transform: scale(1.2);
        }
        
        .btn-editar {
            color: #f39c12;
        }
        
        .btn-eliminar {
            color: #e74c3c;
        }
        
        /* Mensaje cuando no hay datos */
        .no-data {
            text-align: center;
            padding: 30px;
            color: #7f8c8d;
            font-style: italic;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .input-group {
                flex-direction: column;
            }
            
            .input-field {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sistema de Gestión de Contactos</h1>
        
        <div class="form-section">
            <h2 class="form-title">Agregar Nuevo Contacto</h2>
            <div class="input-group">
                <div class="input-field">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" placeholder="Ingrese el nombre">
                </div>
                <div class="input-field">
                    <label for="apellido">Apellido</label>
                    <input type="text" id="apellido" placeholder="Ingrese el apellido">
                </div>
                <div class="input-field">
                    <label for="telefono">Teléfono</label>
                    <input type="text" id="telefono" placeholder="Ingrese el teléfono">
                </div>
            </div>
            <button id="btnGuardar" class="btn-guardar">
                <span>💾</span> Guardar
            </button>
        </div>
        
        <div class="table-section">
            <h2 class="table-title">Lista de Contactos</h2>
            <table>
                <thead>
                   <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Teléfono</th>
                    <th>Opciones</th>
                   </tr> 
                </thead>
                <tbody id="datos">
                    <!-- Los datos se insertarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        let inpNombre = document.getElementById("nombre")
        let inpApellido = document.getElementById("apellido")
        let inpTelefono = document.getElementById("telefono")
        let registro = []
        
        document.getElementById("btnGuardar").addEventListener("click", ()=>{
            if( inpNombre.value==""){
                alert("Se requiere el nombre")
            }else if(inpApellido.value==""){
                alert("Se requiere el apellido")
            }else if(inpTelefono.value==""){
                alert("Se requiere el telefono")
            }else{
                let data = {
                    id:Date.now(),
                    nombre:inpNombre.value,
                    apellido:inpApellido.value,
                    telefono:inpTelefono.value
                }

                registro.push(data)
                console.log(registro);
                pintar()
                limpiar()
            }
        })

        function limpiar(){
            inpNombre.value = ""
            inpApellido.value = ""
            inpTelefono.value = ""
        }

        function pintar(){
            let datosBody = document.getElementById("datos")
            datosBody.textContent = ""
            
            if (registro.length === 0) {
                let tr = document.createElement("tr")
                let td = document.createElement("td")
                td.colSpan = 5
                td.className = "no-data"
                td.textContent = "No hay contactos registrados. Agregue uno nuevo."
                tr.appendChild(td)
                datosBody.appendChild(tr)
                return
            }
            
            registro.forEach((item, indice)=>{
                let tr = document.createElement("tr")
                let tdId = document.createElement("td")
                let tdNombre = document.createElement("td")
                let tdApellido = document.createElement("td")
                let tdTelefono = document.createElement("td")
                let tdOpciones = document.createElement("td")
                
                tdId.textContent = item.id
                tdNombre.textContent = item.nombre
                tdApellido.textContent = item.apellido
                tdTelefono.textContent = item.telefono
                
                let btnEditar = document.createElement("button")
                btnEditar.textContent ="✏️"
                btnEditar.className = "btn-accion btn-editar"
                btnEditar.title = "Editar contacto"
                btnEditar.addEventListener("click",()=>{
                    inpNombre.value = item.nombre
                    inpApellido.value = item.apellido
                    inpTelefono.value = item.telefono
                    registro.splice(indice, 1)
                    pintar()
                })
                
                let btnEliminar = document.createElement("button")
                btnEliminar.textContent ="🗑️"
                btnEliminar.className = "btn-accion btn-eliminar"
                btnEliminar.title = "Eliminar contacto"
                btnEliminar.addEventListener("click",()=>{
                    if (confirm("¿Está seguro de que desea eliminar este contacto?")) {
                        registro.splice(indice, 1)
                        pintar()
                    }
                })
                
                tdOpciones.appendChild(btnEditar)
                tdOpciones.appendChild(btnEliminar)
                tr.appendChild(tdId)
                tr.appendChild(tdNombre)
                tr.appendChild(tdApellido)
                tr.appendChild(tdTelefono)
                tr.appendChild(tdOpciones)
                datosBody.appendChild(tr)
            })
        }
        
        // Pintar tabla inicialmente
        pintar()
    </script>
</body>
</html>
